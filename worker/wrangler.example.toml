name = "btc-sentinel"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
# A deployed preview remains inert until this exact value is changed to "true".
PRODUCTION_DISPATCH_ENABLED = "false"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "btc-sentinel"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../migrations"

# Never put secrets in this file. Add them with `wrangler secret put`:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_ADMIN_USER_ID
# TELEGRAM_WEBHOOK_SECRET
# STATE_API_HMAC_SECRET
# GITHUB_ACTIONS_TOKEN (fine-grained token: Actions write for this repository only)
