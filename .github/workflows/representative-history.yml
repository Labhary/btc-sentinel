name: Representative historical evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/representative-history.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Create evidence root
        run: mkdir artifacts

      - name: Acquire official one-minute market history
        run: >-
          btc-sentinel-fetch-history
          2021-01 2026-01
          artifacts/market-2021-2025
          --dataset-id binance-vision-btcusdt-2021-2025-v1

      - name: Acquire official native monthly warm-up
        run: >-
          btc-sentinel-fetch-monthly-history
          2017-08 2024-03
          artifacts/monthly-2017-2024-02
          --dataset-id binance-vision-btcusdt-native-monthly-2017-2024-02-v2

      - name: Materialize retained official risk evidence
        run: |
          sha256sum --check --strict evidence/official-risk-evidence-2022-2025-v1.parts.sha256
          cat \
            evidence/official-risk-evidence-2022-2025-v1.zip.part-00 \
            evidence/official-risk-evidence-2022-2025-v1.zip.part-01 \
            evidence/official-risk-evidence-2022-2025-v1.zip.part-02 \
            > "$RUNNER_TEMP/official-risk-evidence-2022-2025-v1.zip"
          echo "4dd11668fae3194c3643e02b48eea378699821ba5aca845d8de60eddf52ebd71  $RUNNER_TEMP/official-risk-evidence-2022-2025-v1.zip" \
            | sha256sum --check --strict
          mkdir artifacts/risk-evidence-2022-2025
          unzip -q "$RUNNER_TEMP/official-risk-evidence-2022-2025-v1.zip" \
            -d artifacts/risk-evidence-2022-2025

      - name: Derive point-in-time risk history
        run: >-
          btc-sentinel-build-risk-history
          artifacts/risk-evidence-2022-2025/evidence-manifest.json
          artifacts/risk-history-2022-2025
          --dataset-id official-risk-2022-2025-v1

      - name: Run frozen representative evaluation
        run: |
          btc-sentinel-run-history \
            artifacts/market-2021-2025/manifest.json \
            artifacts/risk-history-2022-2025/risk-manifest.json \
            2022-01-01T00:00:00Z \
            2026-01-01T00:00:00Z \
            --monthly-manifest artifacts/monthly-2017-2024-02/monthly-manifest.json \
            | tee artifacts/representative-report.json

      - name: Retain immutable evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-history-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
