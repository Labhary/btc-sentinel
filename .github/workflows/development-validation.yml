name: Rules v0.7 development validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/development-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Create development evidence root
        run: mkdir artifacts

      - name: Acquire official one-minute development history
        run: >-
          btc-sentinel-fetch-history
          2021-01 2022-01
          artifacts/market-2021
          --dataset-id binance-vision-btcusdt-development-2021-v1

      - name: Acquire official native monthly warm-up
        run: >-
          btc-sentinel-fetch-monthly-history
          2017-08 2022-01
          artifacts/monthly-2017-2021
          --dataset-id binance-vision-btcusdt-native-monthly-development-2017-2021-v1

      - name: Acquire retained official risk evidence
        run: >-
          btc-sentinel-fetch-risk-history
          --start-year 2021
          --end-year 2022
          --output artifacts/risk-evidence-2021
          --dataset-id official-risk-evidence-development-2021-v1

      - name: Derive point-in-time development risk history
        run: >-
          btc-sentinel-build-risk-history
          artifacts/risk-evidence-2021/evidence-manifest.json
          artifacts/risk-history-2021
          --dataset-id official-risk-development-2021-v1

      - name: Run development diagnostic
        run: |
          btc-sentinel-run-history \
            artifacts/market-2021/manifest.json \
            artifacts/risk-history-2021/risk-manifest.json \
            2021-01-01T00:00:00Z \
            2022-01-01T00:00:00Z \
            --monthly-manifest artifacts/monthly-2017-2021/monthly-manifest.json \
            | tee artifacts/development-report.json

      - name: Verify audit fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/development-report.json").read_text())
          required = {
              "analysis_ready_boundaries",
              "analysis_ready_first_boundary",
              "analysis_ready_last_boundary",
              "evaluated_boundaries",
              "rejection_counts",
              "fixed",
              "managed",
          }
          missing = sorted(required - report.keys())
          if missing:
              raise SystemExit(f"development report is missing audit fields: {missing}")
          PY

      - name: Retain complete development evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-v0.7-development-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
