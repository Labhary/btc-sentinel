name: Rules v0.7 development validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/development-validation.yml
      - src/btc_sentinel/backtesting/**
      - src/btc_sentinel/analysis/**
      - src/btc_sentinel/signals/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Create development evidence root
        run: mkdir artifacts

      - name: Acquire official one-minute development history
        run: >-
          btc-sentinel-fetch-history
          2021-01 2022-01
          artifacts/market-2021
          --dataset-id binance-vision-btcusdt-development-2021-v1

      - name: Acquire official native monthly warm-up
        run: >-
          btc-sentinel-fetch-monthly-history
          2017-08 2022-01
          artifacts/monthly-2017-2021
          --dataset-id binance-vision-btcusdt-native-monthly-development-2017-2021-v1

      - name: Audit complete analysis input readiness
        run: |
          btc-sentinel-audit-development-readiness \
            artifacts/market-2021/manifest.json \
            2021-01-01T00:00:00Z \
            2022-01-01T00:00:00Z \
            --monthly-manifest artifacts/monthly-2017-2021/monthly-manifest.json \
            | tee artifacts/development-report.json

      - name: Acquire frozen native weekly development warm-up
        run: >-
          btc-sentinel-fetch-weekly-development-history
          2020-01 2021-12
          artifacts/weekly-2020-2021
          --dataset-id binance-vision-btcusdt-native-weekly-development-2020-2021-v1

      - name: Retain full weekly source-overlap diagnostic
        run: |
          python -m btc_sentinel.backtesting.weekly_overlap_job \
            artifacts/market-2021/manifest.json \
            artifacts/weekly-2020-2021/weekly-manifest.json \
            | tee artifacts/weekly-overlap-diagnostic.json

      - name: Audit readiness with native weekly inputs
        run: |
          btc-sentinel-audit-development-readiness \
            artifacts/market-2021/manifest.json \
            2021-01-01T00:00:00Z \
            2022-01-01T00:00:00Z \
            --monthly-manifest artifacts/monthly-2017-2021/monthly-manifest.json \
            --weekly-manifest artifacts/weekly-2020-2021/weekly-manifest.json \
            2> artifacts/weekly-readiness-error.json \
            | tee artifacts/weekly-readiness-report.json

      - name: Show retained rejection diagnostic
        if: failure()
        run: |
          if [ -s artifacts/weekly-readiness-error.json ]; then
            cat artifacts/weekly-readiness-error.json
          fi

      - name: Verify both audits remain readiness-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/development-report.json").read_text())
          required = {
              "analysis_ready_boundaries",
              "analysis_ready_first_boundary",
              "analysis_ready_last_boundary",
              "evaluated_boundaries",
              "rejection_counts",
              "performance_verdict",
              "stop_reason",
          }
          missing = sorted(required - report.keys())
          if missing:
              raise SystemExit(f"development report is missing audit fields: {missing}")
          if report["analysis_ready_boundaries"] != 0:
              raise SystemExit(
                  "analysis inputs became ready; freeze this report and start a separate "
                  "point-in-time risk validation before any signal evaluation"
              )
          if report["performance_verdict"] != "NOT_RUN":
              raise SystemExit("readiness audit must not report strategy performance")
          weekly = json.loads(Path("artifacts/weekly-readiness-report.json").read_text())
          if required - weekly.keys():
              raise SystemExit("weekly readiness report is missing audit fields")
          for field in (
              "coverage_start", "coverage_end", "evaluated_boundaries",
              "market_manifest_sha256", "native_monthly_manifest_sha256",
          ):
              if weekly[field] != report[field]:
                  raise SystemExit(f"weekly supplement changed baseline field: {field}")
          if weekly["performance_verdict"] != "NOT_RUN":
              raise SystemExit("weekly readiness audit must not report strategy performance")
          if weekly["native_weekly_overlap_checked_count"] < 1:
              raise SystemExit("native weekly data was not cross-checked against derived weeks")
          if len(weekly["native_weekly_manifest_sha256"]) != 64:
              raise SystemExit("weekly input manifest hash is missing")
          ready = weekly["analysis_ready_boundaries"]
          if not 0 <= ready <= weekly["evaluated_boundaries"]:
              raise SystemExit("weekly readiness count is invalid")
          bounds = (weekly["analysis_ready_first_boundary"], weekly["analysis_ready_last_boundary"])
          if (ready == 0) != (bounds == (None, None)):
              raise SystemExit("weekly readiness bounds contradict its count")
          PY

      - name: Retain complete development evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-v0.7-development-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
