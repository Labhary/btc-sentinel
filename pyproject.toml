[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-sentinel"
version = "0.12.4"
description = "Auditable BTC/USDT analysis and paper-trading Telegram bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
btc-sentinel-paper-engine = "btc_sentinel.runtime.job:main"
btc-sentinel-validate-history = "btc_sentinel.backtesting.job:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
